name: Deploy FastAPI to AWS EC2

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop

permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 3.12 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 의존성을 실제로 설치하지는 않습니다.
      # torch · mediapipe 까지 받으면 러너에서 5분 넘게 걸리는데,
      # 그렇게 해도 SMPL-X 모델이 없어 어차피 파이프라인은 못 돌립니다.
      # 문법 오류로 서버가 기동조차 못 하는 경우만 여기서 걸러냅니다.
      # 실제 기동 검증은 배포 후 /health 로 합니다.
      - name: 문법 검사
        run: python -m compileall -q app

      - name: EC2 배포
        if: github.event_name == 'push'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_KEY }}
          # 모델 로딩까지 포함해 넉넉히 잡습니다.
          command_timeout: 10m
          script: |
            set -e
            cd /home/ubuntu/14th-ISIX-ai

            # pull 대신 reset 을 씁니다. 서버에서 급하게 파일을 고친 적이 있으면
            # pull 이 충돌로 멈추고, 그때 배포가 절반만 된 상태로 남습니다.
            # .env 와 assets/ 는 추적 대상이 아니라 reset 으로 지워지지 않습니다.
            git fetch origin develop
            git reset --hard origin/develop
            echo "배포 커밋: $(git log -1 --oneline)"

            # requirements.txt 가 바뀐 배포에서만 설치합니다.
            # 매번 돌리면 변화가 없어도 30초씩 더 걸립니다.
            # -c constraints.txt 는 반드시 넣습니다. 빼면 numpy 가 2.x 로
            # 올라가 mediapipe 가 import 부터 실패합니다.
            if ! git diff --quiet HEAD@{1} HEAD -- requirements.txt constraints.txt 2>/dev/null; then
                echo "의존성이 변경되어 재설치합니다"
                ./venv/bin/pip install -q -c constraints.txt -r requirements.txt
            else
                echo "의존성 변경 없음"
            fi

            sudo systemctl reset-failed closr-ai 2>/dev/null || true
            sudo systemctl restart closr-ai

            # is-active 로는 부족합니다. uvicorn 프로세스가 뜬 순간 active 가 되는데,
            # SMPL-X 모델(약 291MB)을 읽는 데 10초 남짓 더 걸립니다. 그동안은
            # 포트가 열려 있어도 요청을 받지 못합니다. 실제 응답으로 판정합니다.
            TIMEOUT=120
            DEADLINE=$(( $(date +%s) + TIMEOUT ))
            CODE=000

            echo "기동 확인 중 (최대 ${TIMEOUT}초)"
            while [ "$(date +%s)" -lt "$DEADLINE" ]; do
                CODE=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
                       http://127.0.0.1:8000/health || true)
                [ -z "$CODE" ] && CODE=000
                [ "$CODE" = "200" ] && break

                RESTARTS=$(systemctl show closr-ai -p NRestarts --value 2>/dev/null || echo 0)
                if [ "${RESTARTS:-0}" -ge 3 ]; then
                    echo "재시작이 반복되고 있습니다 (NRestarts=$RESTARTS). 기동 실패로 판단합니다."
                    break
                fi
                sleep 3
            done

            if [ "$CODE" != "200" ]; then
                echo "기동 확인 실패: 마지막 응답 코드 $CODE"
                sudo systemctl status closr-ai --no-pager || true
                sudo journalctl -u closr-ai -n 50 --no-pager
                exit 1
            fi

            # R2 설정이 빠지면 GLB 가 http 로 나가고, 프론트에서는 mixed content 로
            # 막혀 "모델이 안 보인다" 로만 드러납니다. 배포 때마다 확인합니다.
            if [ "$(grep -c '^R2_' .env)" -ne 6 ]; then
                echo "경고: .env 의 R2 설정이 6줄이 아닙니다. GLB 가 로컬 주소로 나갑니다."
            fi

            echo "배포 완료 (HTTP $CODE)"

      - name: PR에 검사 완료 댓글 남기기
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🛠️ **문법 검사가 완료되었습니다!** (PR에서는 배포하지 않습니다)\n\n| Item | Status |\n|---|---|\n| **Result** | ✅ Success |\n| **Triggered By** | @' + context.actor + ' |'
            })
